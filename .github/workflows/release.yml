name: Release Docksmith

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag, host, and toolchain
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcrun swift --version
          swift_major="$(xcrun swift --version | sed -nE 's/.*Swift version ([0-9]+).*/\1/p' | head -n 1)"
          test "$swift_major" -ge 6
      - name: Test and build
        run: |
          swift test
          swift build -c release
      - name: Package and verify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(lipo -archs .build/release/docksmith)" = "$EXPECTED_ARCH"
          .build/release/docksmith --help
          mkdir -p stage dist verify
          version="${RELEASE_TAG#v}"
          version="${version%%-*}"
          scripts/bundle-app.sh release "$version" "$GITHUB_RUN_NUMBER" dist
          test "$(lipo -archs dist/Docksmith.app/Contents/MacOS/DocksmithApp)" = "$EXPECTED_ARCH"
          app_archive="docksmith-${RELEASE_TAG}-macos-${EXPECTED_ARCH}.app.zip"
          ditto -c -k --keepParent dist/Docksmith.app "dist/$app_archive"
          ditto -x -k "dist/$app_archive" verify
          test "$(lipo -archs verify/Docksmith.app/Contents/MacOS/DocksmithApp)" = "$EXPECTED_ARCH"
          plutil -lint verify/Docksmith.app/Contents/Info.plist
          test -s verify/Docksmith.app/Contents/Resources/Docksmith.icns
          cp .build/release/docksmith LICENSE README.md stage/
          cli_archive="docksmith-${RELEASE_TAG}-macos-${EXPECTED_ARCH}.tar.gz"
          tar -czf "dist/$cli_archive" -C stage docksmith LICENSE README.md
          tar -xzf "dist/$cli_archive" -C verify
          test "$(lipo -archs verify/docksmith)" = "$EXPECTED_ARCH"
          verify/docksmith --help
      - uses: actions/upload-artifact@v7
        with:
          name: docksmith-${{ matrix.arch }}
          path: |
            dist/*.app.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: docksmith-*
          path: dist
          merge-multiple: true
      - name: Verify assets and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test -f "dist/docksmith-${RELEASE_TAG}-macos-arm64.tar.gz"
          test -f "dist/docksmith-${RELEASE_TAG}-macos-x86_64.tar.gz"
          test -f "dist/docksmith-${RELEASE_TAG}-macos-arm64.app.zip"
          test -f "dist/docksmith-${RELEASE_TAG}-macos-x86_64.app.zip"
          cd dist
          sha256sum \
            "docksmith-${RELEASE_TAG}-macos-arm64.app.zip" \
            "docksmith-${RELEASE_TAG}-macos-x86_64.app.zip" \
            "docksmith-${RELEASE_TAG}-macos-arm64.tar.gz" \
            "docksmith-${RELEASE_TAG}-macos-x86_64.tar.gz" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            dist/docksmith-"$RELEASE_TAG"-macos-arm64.app.zip \
            dist/docksmith-"$RELEASE_TAG"-macos-x86_64.app.zip \
            dist/docksmith-"$RELEASE_TAG"-macos-arm64.tar.gz \
            dist/docksmith-"$RELEASE_TAG"-macos-x86_64.tar.gz \
            dist/SHA256SUMS \
            --verify-tag --draft "${options[@]}" \
            --title "Docksmith $RELEASE_TAG" \
            --notes "Docksmith native macOS app and companion CLI for arm64 and x86_64. Apple Configurator is required separately for cfgutil. These binaries are unsigned and not notarized."
          gh release edit "$RELEASE_TAG" --draft=false
