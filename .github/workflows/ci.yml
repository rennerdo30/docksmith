name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Swift on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Verify host and toolchain
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcrun swift --version
          swift_major="$(xcrun swift --version | sed -nE 's/.*Swift version ([0-9]+).*/\1/p' | head -n 1)"
          test "$swift_major" -ge 6
      - name: Test and build
        run: |
          swift test
          swift build -c release
      - name: Check binary architecture and CLI help
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          file .build/release/docksmith
          test "$(lipo -archs .build/release/docksmith)" = "$EXPECTED_ARCH"
          .build/release/docksmith --help
      - name: Bundle and inspect native app
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          scripts/bundle-app.sh release 0.1.0 "$GITHUB_RUN_NUMBER" dist
          test "$(lipo -archs dist/Docksmith.app/Contents/MacOS/DocksmithApp)" = "$EXPECTED_ARCH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/Docksmith.app/Contents/Info.plist)" = "Docksmith.icns"
          test -s dist/Docksmith.app/Contents/Resources/Docksmith.icns
          archive="dist/docksmith-ci-macos-${EXPECTED_ARCH}.app.zip"
          ditto -c -k --keepParent dist/Docksmith.app "$archive"
          mkdir -p dist/verify
          ditto -x -k "$archive" dist/verify
          test "$(lipo -archs dist/verify/Docksmith.app/Contents/MacOS/DocksmithApp)" = "$EXPECTED_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: docksmith-app-${{ matrix.arch }}
          path: dist/docksmith-ci-macos-${{ matrix.arch }}.app.zip
          if-no-files-found: error
          retention-days: 7
